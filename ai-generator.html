<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oura Identity | Live AI Post & Hashtag Generator</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .generator-wrapper {
            max-width: 820px;
            margin: 30px auto;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #cbd5e1;
            font-size: 0.88rem;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            background: #020617;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 0.92rem;
            outline: none;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--accent-cyan, #06b6d4);
        }
        .gen-btn {
            width: 100%;
            background: var(--accent-cyan, #06b6d4);
            color: #020617;
            border: none;
            padding: 13px 20px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.25s ease, transform 0.2s ease;
        }
        .gen-btn:hover:not(:disabled) {
            opacity: 0.92;
            transform: translateY(-2px);
        }
        .gen-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }
        .status-note {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #94a3b8;
            text-align: center;
        }
        .status-error {
            color: #f87171;
        }
        .status-success {
            color: #34d399;
        }
        .output-box {
            display: none;
            margin-top: 24px;
            background: #020617;
            border: 1px solid var(--accent-cyan, #06b6d4);
            border-radius: 12px;
            padding: 22px;
        }
        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 10px;
        }
        .output-header h4 {
            color: var(--accent-cyan, #06b6d4);
            font-size: 1.05rem;
        }
        .copy-btn {
            background: rgba(6, 182, 212, 0.14);
            color: var(--accent-cyan, #06b6d4);
            border: 1px solid rgba(6, 182, 212, 0.45);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }
        .copy-btn:hover {
            background: var(--accent-cyan, #06b6d4);
            color: #020617;
        }
        .generated-text {
            color: #f8fafc;
            font-size: 0.95rem;
            line-height: 1.65;
            white-space: pre-line;
            margin-bottom: 14px;
        }
        .hashtags-box {
            background: #0f172a;
            border: 1px dashed #334155;
            padding: 12px 14px;
            border-radius: 8px;
            color: var(--accent-cyan, #06b6d4);
            font-size: 0.88rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">OURA <span>IDENTITY</span></div>
        <nav>
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="portfolio.html">Portfolio</a>
            <a href="ai-audit.html">AI Audit Engine</a>
            <a href="ai-generator.html" class="active">AI Post Generator</a>
        </nav>
    </header>

    <section>
        <div class="section-title">
            <h2>Live AI Post, Ad Copy &amp; Hashtag Generator</h2>
            <p>Powered Directly by n8n Webhook &amp; AI Workflow</p>
        </div>

        <div class="generator-wrapper">
            <div class="form-grid">
                <div class="form-group">
                    <label for="brandName">Brand / Business Name</label>
                    <input type="text" id="brandName" placeholder="e.g., Oura Identity" value="Oura Identity">
                </div>

                <div class="form-group">
                    <label for="nicheTopic">Topic / Service / Campaign</label>
                    <input type="text" id="nicheTopic" placeholder="e.g., Social Media Management & Paid Ads" value="Social Media Management & Paid Ads">
                </div>

                <div class="form-group">
                    <label for="platformSelect">Platform</label>
                    <select id="platformSelect">
                        <option value="Instagram & Facebook">Instagram &amp; Facebook</option>
                        <option value="Meta / Google Ads">Meta / Google Ads</option>
                        <option value="LinkedIn">LinkedIn</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="goalSelect">Goal</label>
                    <select id="goalSelect">
                        <option value="Lead Generation">Lead Generation</option>
                        <option value="Brand Awareness">Brand Awareness</option>
                        <option value="Promo Offer">Promo Offer</option>
                    </select>
                </div>
            </div>

            <button class="gen-btn" id="genBtn" onclick="generateViaWorkflow()">⚡ Generate via Live n8n Workflow</button>
            <div class="status-note" id="statusNote">Waiting to connect with n8n webhook.</div>

            <div class="output-box" id="outputBox">
                <div class="output-header">
                    <h4>✨ Live AI Workflow Output</h4>
                    <button class="copy-btn" id="copyBtn" onclick="copyGeneratedText()">Copy All</button>
                </div>
                <div class="generated-text" id="generatedPost"></div>
                <div class="hashtags-box" id="generatedHashtags"></div>
            </div>
        </div>
    </section>

    <footer>
        <p>Created by <span>Ruqayya Shafi</span> • Founder, Oura Identity Digital Brand Agency</p>
    </footer>

    <script>
        // Apni real n8n Webhook URL yahan dalein:
        const N8N_WEBHOOK_URL = 'http://localhost:5678/webhook-test/oura-post-generator';

        async function generateViaWorkflow() {
            const brand = document.getElementById('brandName').value.trim();
            const topic = document.getElementById('nicheTopic').value.trim();
            const platform = document.getElementById('platformSelect').value;
            const goal = document.getElementById('goalSelect').value;

            const btn = document.getElementById('genBtn');
            const statusNote = document.getElementById('statusNote');
            const outputBox = document.getElementById('outputBox');

            statusNote.className = 'status-note';

            if (!N8N_WEBHOOK_URL || N8N_WEBHOOK_URL === 'YOUR_N8N_WEBHOOK_URL_HERE') {
                outputBox.style.display = 'none';
                statusNote.className = 'status-note status-error';
                statusNote.innerText = 'Error: Real n8n Webhook URL abhi add nahi hui.';
                return;
            }

            if (!brand || !topic) {
                outputBox.style.display = 'none';
                statusNote.className = 'status-note status-error';
                statusNote.innerText = 'Error: Brand Name aur Topic dono fill karein.';
                return;
            }

            btn.disabled = true;
            btn.innerText = '⏳ Running n8n Workflow...';
            statusNote.innerText = 'Sending POST request to n8n webhook...';

            try {
                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ brand, topic, platform, goal })
                });

                if (!response.ok) {
                    throw new Error('HTTP Status ' + response.status);
                }

                const data = await response.json();
                const postText = data.post || data.content || data.caption || data.output || '';
                const tagsText = data.hashtags || '';

                if (!postText) {
                    throw new Error('n8n response mein post/content field nahi mila.');
                }

                document.getElementById('generatedPost').innerText = postText;
                document.getElementById('generatedHashtags').innerText = tagsText;
                outputBox.style.display = 'block';
                document.getElementById('copyBtn').innerText = 'Copy All';

                statusNote.className = 'status-note status-success';
                statusNote.innerText = 'Live response received from n8n workflow.';
            } catch (err) {
                outputBox.style.display = 'none';
                statusNote.className = 'status-note status-error';
                statusNote.innerText = 'Workflow Error: ' + err.message;
            } finally {
                btn.disabled = false;
                btn.innerText = '⚡ Generate via Live n8n Workflow';
            }
        }

        function copyGeneratedText() {
            const post = document.getElementById('generatedPost').innerText;
            const tags = document.getElementById('generatedHashtags').innerText;
            const combined = tags ? post + '\n\n' + tags : post;
            navigator.clipboard.writeText(combined).then(() => {
                document.getElementById('copyBtn').innerText = 'Copied ✓';
            });
        }
    </script>
</body>
</html>
