<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oura Identity | AI Audit & Growth Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">OURA <span>IDENTITY</span></div>
        <nav>
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="portfolio.html">Portfolio</a>
            <a href="ai-audit.html" class="active">AI Audit Engine</a>
        </nav>
    </header>

    <section>
        <div class="section-title">
            <h2>Live AI Business Growth & Audit Engine</h2>
            <p>Enterprise-grade automated digital marketing analysis built via JavaScript & AI webhooks</p>
        </div>

        <div class="audit-box">
            <form id="auditForm">
                <div class="form-group">
                    <label>Client / Brand Name</label>
                    <input type="text" id="bizName" placeholder="e.g., Karachi Fashion & Apparel" required>
                </div>
                <div class="form-group">
                    <label>Primary Marketing Objective</label>
                    <select id="bizGoal">
                        <option value="Social Media Brand Awareness & Content">Social Media Brand Awareness & Content</option>
                        <option value="Google Ranking & SEO Backlink Growth">Google Ranking & SEO Backlink Growth</option>
                        <option value="Meta Paid Ads & Direct Lead Generation">Meta Paid Ads & Direct Lead Generation</option>
                        <option value="Full AI Automation & CRM Integration">Full AI Automation & CRM Integration</option>
                    </select>
                </div>
                <button type="submit" class="btn full-btn">Run Automated AI Strategy Generator</button>
            </form>

            <div id="ai-result" style="display: none; margin-top: 25px; padding: 25px; background: rgba(6, 182, 212, 0.08); border-left: 4px solid var(--accent-cyan); border-radius: 8px;">
                <h4 style="color: var(--accent-cyan); margin-bottom: 12px; font-size: 1.2rem;">⚡ Oura Identity Automated Strategy Report:</h4>
                <p id="resultText" style="color: #e2e8f0; line-height: 1.8; font-size: 0.95rem;"></p>
                
                <button type="button" id="copyBtn" class="btn" style="margin-top: 20px; background: #1e293b; border: 1px solid var(--accent-cyan); font-size: 0.9rem; padding: 10px 20px;">
                    📋 Copy Report to Clipboard
                </button>
            </div>
        </div>
    </section>

    <footer>
        <p>Created by <span>Ruqayya Shafi</span> • Founder, Oura Identity Digital Brand Agency</p>
        
    </footer>

    <script src="script.js"></script>
</body>
</html>
